unit.超限工艺-u1A1ha11利刃.name = OEO-利刃
unit.超限工艺-u1A1ha11利刃.description = [orange]全位算体[white]基础陆军，由[pink]德尔塔[white]设计，[red]泽塔议会[white]尖刀的原型机甲，全位算体军团中的先锋部队。\n移速较快，轻型装甲，攻击时向敌人一次性发射三枚标准子弹。\n\n[orange][全位算体常规部队]

unit.超限工艺-u1A1ha1狂战士.name = OEO-焰怒
unit.超限工艺-u1A1ha1狂战士.description = [orange]全位算体[white]主力陆军，由[pink]德尔塔[white]设计，[red]泽塔议会[white]战锤与堡垒的原型机甲，战场上极为可怕的敌人，他随着战火向前推进。\n装甲厚重，向附近的敌人发射火焰榴弹炮，带四个机枪辅助攻击，近战可纵火。\n[orange][全位算体精英部队]

unit.超限工艺-u1A1hb11落星.name = OEO-落星
unit.超限工艺-u1A1hb11落星.description = [orange]全位算体[white]基础空军，由[pink]德尔塔[white]设计，[red]泽塔议会[white]星辉的原型战机，全位算体军团中的先锋部队。\n常规作战飞行器，向地面的敌人一次性发射两枚标准子弹并发射一发导弹。\n\n[orange][全位算体常规部队]

unit.超限工艺-u1A1hb12空点.name = OEO-空点
unit.超限工艺-u1A1hb12空点.description = [orange]全位算体[white]基础空军，由[pink]德尔塔[white]设计，[red]泽塔议会[white]天垠的原型轰炸机，全位算体军团中的战术部队。\n标准轰炸机，护甲适中，配备有两匹机枪突袭陆军，临近陆军时被投放大量反掩体炸弹。\n\n[orange][全位算体常规部队]

unit.超限工艺-u1A1hb1扫荡者.name = OEO-扫荡
unit.超限工艺-u1A1hb1扫荡者.description = [orange]全位算体[white]主战空军，由[pink]德尔塔[white]设计，[red]泽塔议会[white]苍穹的原型攻击机，全位算体军团中的主力部队。\n标准攻击机向附近的地面敌人发射海量导弹，每颗导弹中包含大量矿渣溶液，对建筑造成毁灭性打击，其激光主炮依旧有极端可怕的威胁。\n[orange][全位算体精英部队]

unit.超限工艺-u1A1hb4贯日.name = OEO-贯日
unit.超限工艺-u1A1hb4贯日.description = [orange]全位算体[white]实验级空军，由[slate]欧泽文[white]设计，生不逢时的它本该随历史埋没，如今在科研小组的努力下重新出现。\n装甲厚重，强力的攻城单位，拥有部署模式和非部署模式。\n非部署模式下以副炮为主要攻击手段，副炮攻击时发射有效反制单位的导弹。\n部署之后可以开启主炮，主炮可向建筑发射毁灭性的热融炮，[red]部署期间无法移动[white]。\n形态转换了之后会有10秒钟无法攻击。\n[orange][全位算体实验级部队]

unit.超限工艺-u1A1hb4贯日(1).name = OEO-贯日[部署]
unit.超限工艺-u1A1hb4贯日(1).description = [orange]全位算体[white]实验级空军，由[slate]欧泽文[white]设计，生不逢时的它本该随历史埋没，如今在科研小组的努力下重新出现。\n装甲厚重，强力的攻城单位，拥有部署模式和非部署模式。\n非部署模式下以副炮为主要攻击手段，副炮攻击时发射有效反制单位的导弹。\n部署之后可以开启主炮，主炮可向建筑发射毁灭性的热融炮，[red]部署期间无法移动[white]。\n形态转换了之后会有10秒钟无法攻击。\n[orange][全位算体实验级部队]

unit.超限工艺-u1A1hc1猎杀者.name = OEO-猎杀
unit.超限工艺-u1A1hc1猎杀者.description = [orange]全位算体[white]主力海军，由[pink]德尔塔[white]设计，[red]泽塔议会[white]戟鲸与飞鲨的原型战舰，全位算体海军主力部队。\n装甲厚重，装备有高精度轨道炮，同时配备有两门蜂巢炮以及四门机炮进行辅助攻击。\n[orange][全位算体精英部队]

unit.超限工艺-u1A1hc11青鲛.name = OEO-青鲛
unit.超限工艺-u1A1hc11青鲛.description = [orange]全位算体[white]基础海军，由[pink]德尔塔[white]设计，[red]泽塔议会[white]梭鱼的原型机甲。\n突击型炮艇，有一门火炮作为主炮，同时配备两门高速机枪。\n[orange][全位算体常规部队]

