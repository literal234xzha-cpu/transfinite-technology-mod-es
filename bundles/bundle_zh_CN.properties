unit.超限工艺-uAABT0D看护.name = TT-看护
unit.超限工艺-uAABT0D看护.description = [blue]超限集团[white]的基础安保部队，由[sky]西[white]设计，战斗力较弱，常用于基地巡逻及侦查。\n简易的悬浮单位，能够高速移动，拥有高攻速，强力的反建筑机枪，不能攻击空中单位。\n\n[blue][超限技术特殊作战单元]

unit.超限工艺-uAABT0K候鸟.name = TT-候鸟
unit.超限工艺-uAABT0K候鸟.description = [blue]超限集团[white]的基础安保部队，由[sky]西[white]设计，战斗力较弱，常用于基地巡逻及侦查。\n飞行单位,小巧而迅速，有极高的攻速，强力的反建筑机枪，不能攻击空中单位。\n\n[blue][超限技术特殊作战单元]

unit.超限工艺-uAABT1A响应.name = TT-锋影
unit.超限工艺-uAABT1A响应.description = [blue]超限集团[white]的先锋部队，由[unlaunched]克西[white]设计，战场上主要执行清扫任务，防御时推荐配合掩体。\n特殊轻机甲，移动速度快，廉价，但是武器威力低下且装甲偏低。\n\n[blue][超限技术作战轻机甲]
unit.超限工艺-uAABT1A响应.details = 蓝爬

unit.超限工艺-uAABT1B卫兵.name = TT-流隼
unit.超限工艺-uAABT1B卫兵.description = [blue]超限集团[white]的先锋部队，由[unlaunched]克西[white]设计，战场上主要执行火力打击任务，防御时推荐配合掩体。\n特殊轻机甲，移动速度快，有较高对建筑的伤害，同时攻击空中单位会有额外的范围伤害，廉价，但是攻击速度偏慢且装甲偏低。\n\n[blue][超限技术作战轻机甲]
unit.超限工艺-uAABT1B卫兵.details = 筒子兵，但不是筒子超人

unit.超限工艺-uAABT2I天星.name = TT-天星
unit.超限工艺-uAABT2I天星.description = [blue]超限集团[white]的轰炸部队，由[unlaunched]克西[white]设计，战场上主要执行日常轰炸任务。\n用于突击敌方建筑，向地面单位泼洒高能炸弹，飞行单位，高速，能够运载少量单位或建筑，死亡生成侧卫-A。\n\n[blue][超限技术特殊作战单元]

