unit.超限工艺-uA0CCZAT1钝击.description = [red]泽塔议会[white]的量产型单位，由[#dc143cff]贝塔[white]设计，在第一次赛普罗战争初期曾作为冲锋在前的先锋部队。\n装甲脆弱，单手火炮，落后且老式，现已被更优秀的改良版取代。\n[red][泽塔议会老式部队]

unit.超限工艺-uA0CCZAT2锤打.name = ZI-锤打(老式)
unit.超限工艺-uA0CCZAT2锤打.description = [red]泽塔议会[white]的量产型单位，由[#dc143cff]贝塔[white]设计，在第一次赛普罗战争初期曾作为进攻的基础部队。\n装甲较为脆弱，单手双管火炮，落后且老式，现已被更优秀的改良版取代。\n[red][泽塔议会老式部队]

unit.超限工艺-uA0CCZBT0清风.name = ZI-清风(老式)
unit.超限工艺-uA0CCZBT0清风.description = [red]泽塔议会[white]的量产型单位，由[unlaunched]克西[white]设计，在第一次赛普罗战争中用于突袭全位算体的部队或基地。\n装甲较为脆弱，自杀式攻击，落后且老式，经改良后，现已成为超限集团的自杀式部队。\n[red][泽塔议会老式部队]

unit.超限工艺-uA0CCZBT1微风.name = ZI-微风(老式)
unit.超限工艺-uA0CCZBT1微风.description = [red]泽塔议会[white]的量产型单位，由[#dc143cff]贝塔[white]设计，在第一次赛普罗战争初期曾作为冲锋在前的先锋部队。\n装甲较为脆弱，单管火炮，无法对空和旋转，落后且老式，现已被更优秀的改良版取代。\n[red][泽塔议会老式部队]

unit.超限工艺-uA0CCZBT2旋刃.name = ZI-旋刃(老式)
unit.超限工艺-uA0CCZBT2旋刃.description = [red]泽塔议会[white]的量产型单位，由[#dc143cff]贝塔[white]设计，在第一次赛普罗战争初期曾作为进攻的基础部队。\n装甲较为脆弱，单管连发火炮，落后且老式，现已被更优秀的改良版取代。\n[red][泽塔议会老式部队]

