sector.超限工艺-萃取前哨.description = [yellow]Comienza la infiltración __ New __ __ New __[green]We 're Fast[white]....... __ New __ __ New __[white]Dificultad (Fase 1): Dificultad (Fase 2): Moderada __ New __ __ New __[red](la IA de RTS debe estar habilitada en este mapa para un juego normal) __ New __ __ New __[red](la IA de RTS debe estar habilitada en este mapa para un juego normal) __ New __ __ New __ __ New __[red](la IA de RTS debe estar habilitada en este mapa para un juego normal)
