block.超限工艺-BAAsAT3C落锤.description = 几乎疯狂的设计，连发的榴弹炮，超限集团为了追求火力一时脑热的产物，但在实际使用时发现了诸多问题，最后经过多次整改，他已经可以稳定发射而不是炸膛，在结构的优化下，它可以更加快的速度来有效的打击远程的目标\n\n[blue][超限技术炮台]
