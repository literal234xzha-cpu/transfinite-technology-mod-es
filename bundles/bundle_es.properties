block.超限工艺-BA0s泽塔议会.name = [red]ZetaCouncil (ZI)
block.超限工艺-BA0s泽塔议会.description = Con un imperio dominado por el cerebro principal Zeta, la decisión del imperio es decidida principalmente por Zeta y su parlamento. Él está entusiasmado con las armas pesadas y la tecnología de posición.
block.超限工艺-BA0s泽塔议会.details = [red]La verdad solo está dentro del alcance del cañón, y la autoridad solo está por encima del cañón de hoja afilada.
block.超限工艺-BAAs超限科技s.name = [blue]Grupo de desbordamiento (TT)
block.超限工艺-BAAs超限科技s.description = El grupo científico liderado por Upsilon e Ipsilon, gobierno dictatorial, está interesado en algunas tecnologías de vanguardia y concede gran importancia a las tecnologías electromagnéticas, tal vez ya se han desviado de su intención original centrada en la ciencia.
block.超限工艺-BAAs超限科技s.details = [blue]La búsqueda de la verdad.
block.超限工艺-BA1s超位算体.name = [orange]OEO
block.超限工艺-BA1s超位算体.description = La alianza dominada por el cerebro principal[orange]Omega[white]consiste en fuerzas grandes y pequeñas, que combinan las fortalezas y debilidades de varias fuerzas para formar una súper alianza, y los derrotados en la Primera Guerra Sepro.
block.超限工艺-BA1s超位算体.details = [orange]Después de todo, es solo un sueño roto
block.超限工艺-BA1sGT1A精细化石墨调控厂.name = Compresor de grafito fino OEO
block.超限工艺-BA1sGT1A精细化石墨调控厂.description = Una instalación industrial básica totalmente aritmética, diseñada por[green]Kapa[white]. \n A través de un control y cálculo precisos, el carbón comprimido refinado se convierte en grafito, que puede utilizar en gran medida los recursos, tener una gran producción, un largo tiempo de procesamiento y consumir electricidad. \n[orange][全位算体精加工厂]
block.超限工艺-BA1sGT1B精细化硅调控厂.name = OEO - Refinería de silicio fino
block.超限工艺-BA1sGT1B精细化硅调控厂.description = Una instalación industrial básica totalmente aritmética, diseñada por[green]Kapa[white]. \n Perfeccionar el refinado del silicio a través de un control y cálculo precisos, que pueden utilizar en gran medida los recursos, tener una gran producción, un largo tiempo de procesamiento y consumir electricidad. \n[orange][全位算体精加工厂]
block.超限工艺-BA1sGT1C精细化玻璃调控厂.name = OEO - Horno de vidrio fino
block.超限工艺-BA1sGT1C精细化玻璃调控厂.description = Una instalación industrial básica totalmente aritmética, diseñada por[green]Kapa[white]. \n A través de un control y cálculo precisos, se refina la producción de vidrio templado, que puede utilizar en gran medida los recursos, tener una gran producción, un largo tiempo de procesamiento y consumir electricidad. \n[orange][全位算体精加工厂]
block.超限工艺-BA1sGT1D精细化硫调控厂.name = Planta de control de azufre fino OEO
block.超限工艺-BA1sGT1D精细化硫调控厂.description = Una instalación industrial básica totalmente aritmética, diseñada por[green]Kapa[white]. \n A través de un control y cálculo precisos, el sulfuro se mezcla finamente, lo que puede utilizar altamente los recursos, tener una gran producción, un largo tiempo de procesamiento y consumir electricidad. \n[orange][全位算体精加工厂]
block.超限工艺-BA1sGT1E精细炸药厂.name = OEO - Planta de mezcla de explosivos finos
block.超限工艺-BA1sGT1E精细炸药厂.description = Una instalación industrial básica totalmente aritmética, diseñada por[green]Kapa[white]. \n A través de un control y cálculo precisos, el acabado produce mezclas explosivas, que pueden utilizar en gran medida los recursos, tener una gran producción, un largo tiempo de procesamiento y consumir electricidad. \n[orange][全位算体精加工厂]
block.超限工艺-BA1sGT1F精细塑钢厂.name = OEO - Prensa de acero plástico fino
block.超限工艺-BA1sGT1F精细塑钢厂.description = Una instalación industrial básica totalmente aritmética, diseñada por[green]Kapa[white]. \n A través de un control y cálculo precisos, el acero plástico se puede prensar de manera eficiente, utilizando altamente los recursos, con una gran producción, un largo tiempo de procesamiento y un consumo de energía. \n[orange][全位算体精加工厂]
block.超限工艺-ZY世界处理雷达.name = World Radar
block.超限工艺-ZY世界处理雷达.description = Enemigo de rango extremo, propósito especial
unit.超限工艺-uA0CCZAT1钝击.name = ZI - Blunt (Vintage)
unit.超限工艺-uA0CCZAT1钝击.description = La unidad de tipo producción de[red]ZetaCouncil[white], diseñada por[#dc143cff]Beta[white], se utilizó como unidad de vanguardia en los primeros días de la Primera Guerra de Chipre. __ newl __ La armadura frágil, la artillería con una sola mano, atrasada y anticuada, ahora ha sido reemplazada por una versión mejor y mejorada. \n[red][泽塔议会老式部队]
unit.超限工艺-uA0CCZAT2锤打.name = ZI-Hammering (Vintage)
unit.超限工艺-uA0CCZAT2锤打.description = Las unidades de tipo producción de[red]ZetaCouncil[white], diseñadas por[#dc143cff]beta[white], sirvieron como unidad base para la ofensiva en los primeros días de la Primera Guerra de Chipre. __ newl __ la armadura es más frágil, las armas de dos cañones con una sola mano, atrasadas y anticuadas, han sido reemplazadas por versiones mejores y mejoradas. \n[red][泽塔议会老式部队]
unit.超限工艺-uA0CCZBT0清风.name = ZI-Breeze (Vintage)
unit.超限工艺-uA0CCZBT0清风.description = Una unidad de tipo producción de[red]ZetaCouncil[white], diseñada por[unlaunched]Keshi[white]para ser utilizada en la primera Guerra de los Cipreses para asaltar tropas o bases del cuerpo aritmético completo. __ newl __ La armadura es frágil, de ataque suicida, atrasada y anticuada, y se ha mejorado para convertirse en la fuerza suicida del grupo excesivamente limitado. \n[red][泽塔议会老式部队]
unit.超限工艺-uA0CCZBT1微风.name = ZI-Breeze (Vintage)
unit.超限工艺-uA0CCZBT1微风.description = La unidad de tipo producción de[red]ZetaCouncil[white], diseñada por[#dc143cff]Beta[white], se utilizó como unidad de vanguardia en los primeros días de la Primera Guerra de Chipre. __ newl __ La armadura es más frágil, de un solo cañón, incapaz de volar y girar, retrógrada y anticuada, y ahora ha sido reemplazada por una versión mejor y mejorada. \n[red][泽塔议会老式部队]
unit.超限工艺-uA0CCZBT2旋刃.name = ZI - Cuchilla (Vintage)
unit.超限工艺-uA0CCZBT2旋刃.description = Las unidades de tipo producción de[red]ZetaCouncil[white], diseñadas por[#dc143cff]beta[white], sirvieron como unidad base para la ofensiva en los primeros días de la Primera Guerra de Chipre. __ newl __ La armadura es más frágil, de un solo cañón, atrasada y anticuada, y ha sido reemplazada por una versión mejor y mejorada. \n[red][泽塔议会老式部队]
unit.超限工艺-uAABT0D看护.name = Ametralladora 1
unit.超限工艺-uAABT0D看护.description = La fuerza de seguridad básica del grupo[blue]invadido[white], diseñada por[sky]West[white], es débil en combate y se utiliza a menudo para patrullas de base y reconocimiento. \n Una unidad flotante simple que puede moverse a gran velocidad, tiene una alta velocidad de ataque, una poderosa ametralladora antiestructural y no puede atacar unidades aéreas. \n \n[blue][超限技术特殊作战单元]
unit.超限工艺-uAABT0K候鸟.name = TT-Aves migratorias
unit.超限工艺-uAABT0K候鸟.description = La fuerza de seguridad básica del grupo[blue]invadido[white], diseñada por[sky]West[white], es débil en combate y se utiliza a menudo para patrullas de base y reconocimiento. __ New __ unidad voladora, pequeña y rápida, con velocidad de ataque extremadamente alta, potente ametralladora antiestructural, no puede atacar unidades aéreas. \n \n[blue][超限技术特殊作战单元]
unit.超限工艺-uAABT1A响应.name = respuesta
unit.超限工艺-uAABT1A响应.description = La vanguardia del grupo[blue]Overrun[white], diseñado por[unlaunched]Keshi[white], realiza principalmente tareas de limpieza en el campo de batalla, y recomienda cooperar con el búnker a la hora de defender. __ newl __ Mecánico ligero especial, rápido y económico, pero con poca potencia de arma y poca armadura. \n \n[blue][超限技术作战轻机甲]
unit.超限工艺-uAABT1A响应.details = Blue Crawl
unit.超限工艺-uAABT1B卫兵.name = Guardia
unit.超限工艺-uAABT1B卫兵.description = La vanguardia del grupo[blue]Overrun[white], diseñado por[unlaunched]Keshi[white], realiza principalmente misiones de ataque con fuego en el campo de batalla, y recomienda cooperar con el búnker a la hora de defender. __ newl __ El mecánico ligero especial, el movimiento rápido, el alto daño al edificio y las unidades aéreas de ataque tendrán un daño de alcance adicional, que es barato, pero la velocidad de ataque es lenta y la armadura es baja. \n \n[blue][超限技术作战轻机甲]
unit.超限工艺-uAABT1B卫兵.details = Soldado del tubo, pero no Superman del tubo
unit.超限工艺-uAABT2I天星.name = TT-Stellar
unit.超限工艺-uAABT2I天星.description = La unidad de bombardeo de[blue]Overrun Group[white], diseñada por[unlaunched]Keshi[white], realiza principalmente misiones diarias de bombardeo en el campo de batalla. __ newl __ se utiliza para atacar edificios enemigos, lanzando bombas de alta energía sobre unidades terrestres, unidades voladoras, de alta velocidad, capaces de transportar un pequeño número de unidades o edificios, y matar genera una guardia de flanco-A. \n \n[blue][超限技术特殊作战单元]
unit.超限工艺-u1A1ha11利刃.name = OEO-Blade
unit.超限工艺-u1A1ha11利刃.description = [orange]Full Body[white]Base Army, diseñado por[pink]Delta[white], prototipo de mech para[red]ZetaCouncil[white]Knife, unidad pionera en el Full Body Corps. __ newl __ Blindaje ligero de movimiento rápido que dispara tres balas estándar al enemigo a la vez cuando ataca. \n \n[orange][全位算体常规部队]
unit.超限工艺-u1A1ha1狂战士.name = OEO-Flame
unit.超限工艺-u1A1ha1狂战士.description = [orange]Full Body[white]Main Army, diseñado por[pink]Delta[white],[red]ZetaCouncil[white]El prototipo de meca del Martillo de Guerra y la Fortaleza, un enemigo extremadamente terrible en el campo de batalla, avanzó con el fuego de la guerra. __ newl __ Blindaje pesado, dispara obuses a los enemigos cercanos, cuatro ametralladoras para ayudar en los ataques e incendios provocados en combate cuerpo a cuerpo. \n[orange][全位算体精英部队]
unit.超限工艺-u1A1hb11落星.name = OEO-Stars
unit.超限工艺-u1A1hb11落星.description = [orange]Full Body[white]Fuerza Aérea Básica, diseñado por[pink]Delta[white],[red]ZetaCouncil[white]Caza prototipo Starlight, fuerza pionera en el Full Body Corps. __ New __ Un avión de combate convencional que dispara dos balas estándar y un misil a la vez contra un enemigo en tierra. \n \n[orange][全位算体常规部队]
unit.超限工艺-u1A1hb12空点.name = OEO-punto vacío
unit.超限工艺-u1A1hb12空点.description = [orange]Cuerpo Completo[white]Fuerza Aérea Básica, diseñado por[pink]Delta[white],[red]ZetaCouncil[white]Prototipo de Bombardero, Unidad Táctica en Cuerpo Completo. __ newl __ bombardero estándar, moderadamente blindado, equipado con dos ametralladoras que asaltaban al ejército, fue arrojado un gran número de bombas antibúnker cerca del ejército. \n \n[orange][全位算体常规部队]
unit.超限工艺-u1A1hb1扫荡者.name = No
unit.超限工艺-u1A1hb1扫荡者.description = [orange]Full Body[white]Main Battle Air Force, diseñado por[pink]Delta[white], un prototipo de avión de ataque de[red]ZetaCouncil[white]Sky, la fuerza principal del Full Body Corps. __ newl __ Aviones de ataque estándar dispararon grandes cantidades de misiles contra enemigos terrestres cercanos, cada uno con una gran cantidad de solución de escoria, asestando un golpe devastador al edificio, y sus cañones láser continuaron representando una amenaza extremadamente formidable. \n[orange][全位算体精英部队]
unit.超限工艺-u1A1hb4贯日.name = OEO-ThroughDay
unit.超限工艺-u1A1hb4贯日.description = [orange]Full Body[white]Fuerza Aérea Experimental, diseñada por[slate]OZERWEN[white], que se suponía que estaba enterrada con la historia cuando sucedió, ahora está resurgiendo gracias al esfuerzo del equipo de investigación. __ new_heavy_armor_strong_siege_units_both_deployed_and_nondeployed_modes. \n En el modo de no despliegue, la artillería secundaria se utiliza como el principal medio de ataque, y la artillería secundaria dispara misiles con contramedidas efectivas al atacar. \n Una vez desplegado, el arma principal se puede activar. El arma principal puede disparar cañones de fusión en caliente destructivos contra el edificio, y[white]no se puede mover durante el[red]despliegue. \n Después de la transición morfológica, no podrás atacar durante 10 segundos. \n[orange][全位算体实验级部队]
unit.超限工艺-u1A1hb4贯日(1).name = OEO-Crossing[部署]
unit.超限工艺-u1A1hb4贯日(1).description = [orange]Full Body[white]Fuerza Aérea Experimental, diseñada por[slate]OZERWEN[white], que se suponía que estaba enterrada con la historia cuando sucedió, ahora está resurgiendo gracias al esfuerzo del equipo de investigación. __ new_heavy_armor_strong_siege_units_both_deployed_and_nondeployed_modes. \n En el modo de no despliegue, la artillería secundaria se utiliza como el principal medio de ataque, y la artillería secundaria dispara misiles con contramedidas efectivas al atacar. \n Una vez desplegado, el arma principal se puede activar. El arma principal puede disparar cañones de fusión en caliente destructivos contra el edificio, y[white]no se puede mover durante el[red]despliegue. \n Después de la transición morfológica, no podrás atacar durante 10 segundos. \n[orange][全位算体实验级部队]
unit.超限工艺-u1A1hc1猎杀者.name = OEO-Caza
unit.超限工艺-u1A1hc1猎杀者.description = [orange]Full Body[white]Main Navy, diseñado por[pink]Delta[white],[red]ZetaCouncil[white]Prototipo de Acorazado de Orca y Tiburón Volador, Full Body Navy Main Force. __ newl __ Blindaje pesado, equipado con un cañón orbital de alta precisión, y dos cañones de panal y cuatro ametralladoras para ataques auxiliares. \n[orange][全位算体精英部队]
unit.超限工艺-u1A1hc11青鲛.name = Cian 1
unit.超限工艺-u1A1hc11青鲛.description = [orange]Full Body[white]Base Navy, diseñado por[pink]Delta[white],[red]ZetaCouncil[white]Barracuda prototype mech. __ newl __ cañonera de asalto con una pistola como arma principal y dos ametralladoras de alta velocidad. \n[orange][全位算体常规部队]
sector.超限工艺-零号地区.name = Región cero
sector.超限工艺-零号地区.description = [yellow]¡Advertencia! ¡El núcleo está a punto de descender! \n \n[white]Dificultad: madura
sector.超限工艺-零号地区.details = [lightgrey]Donde empiezan los sueños
sector.超限工艺-冰冻森林.name = Bosque congelado
sector.超限工艺-冰冻森林.description = Un área de recolección de plantas de esporas, rica en reservas de carbón. Así es como podemos volver a desarrollar nuestra industria. \n \n[white]Dificultad: fácil
sector.超限工艺-冰冻森林.details = [lightgrey]Recuperación Industrial
sector.超限工艺-未知废墟.name = Ruina desconocida
sector.超限工艺-未知废墟.description = La fuente de la señal previamente destruida por el núcleo es también donde investigaremos. \n \n[white]Dificultad: fácil
sector.超限工艺-未知废墟.details = [lightgrey]Iniciar la tecnología del módulo aquí
sector.超限工艺-孢染丛林.name = Bosques manchados de esporas
sector.超限工艺-孢染丛林.description = La selva más profunda y remota del bosque congelado también es la fuente de la señal de posición anterior. \n \n[white]Dificultad: Moderada
sector.超限工艺-孢染丛林.details = [lightgrey]¿Estoy cruzando a un teatro antijaponés?
sector.超限工艺-陨石带.name = [blue]Cinturón de meteoros
sector.超限工艺-陨石带.description = Por el momento, el cinturón de meteoritos no está en buenas condiciones, y la señal central parece haber sido detectada allí. \n[yellow]Aún no he llegado, espera un minuto. \n \n[white]Dificultad: Moderada
sector.超限工艺-陨石带.details = [lightgrey]Escuadrón Asesino Kamikaze
sector.超限工艺-污染小道.name = [blue]Sendero contaminado
sector.超限工艺-污染小道.description = Hay un puesto de avanzada de fuerzas desconocidas aquí desde el cual podemos ser capaces de determinar su verdadera identidad, pero ten cuidado, esto no es fácil, hemos establecido un puesto de avanzada aquí, puedes venir y ayudarnos en cualquier momento. \n \n[white]Dificultad: fácil
sector.超限工艺-污染小道.details = [lightgrey]En teoría, eres bueno en tecnología, puedes pasar reforzando tropas
sector.超限工艺-生物质合成区.name = [darkgrey]Zona de síntesis de biomasa (misión secundaria)
sector.超限工艺-生物质合成区.description = [访问无效]__ New __ __ New __[white]Dificultad:[slate]error
sector.超限工艺-真菌通道.name = Canales fúngicos
sector.超限工艺-真菌通道.description = Esto solía ser una base para[red]ZetaCouncil[white], pero ahora parece que ha sido destruido. \n \n[white]Dificultad: Moderada
sector.超限工艺-工业区0032.name = [orange]Zona Industrial 0032
sector.超限工艺-工业区0032.description = Hemos confirmado que hay una señal central aquí, que es nuestra área industrial, y esperamos que la señal allí provenga de los restos del cuerpo aritmético de rango completo[yellow][white]. \n \n[white]Dificultad: fácil
sector.超限工艺-盐碱荒滩.name = [red]páramo salino
sector.超限工艺-盐碱荒滩.description = Tal vez deberíamos empujar un poco más hacia abajo también, pero tenemos que tener cuidado, la señal central aquí es probable que sea del enemigo. \n \n[white]Dificultad: Moderada
sector.超限工艺-盐碱荒滩.details = [lightgrey]Tao Fang Tian Gang
sector.超限工艺-遗迹海滩.name = [red]Ruins Beach
sector.超限工艺-遗迹海滩.description = Este será el final de nuestra etapa actual, tomando esta zona costera y podremos reorganizar nuestras fuerzas. \n \n[white]Dificultad: Moderada
sector.超限工艺-遗迹海滩.details = [lightgrey]La leyenda de la electricidad y el agua
sector.超限工艺-废弃研究所.name = [orange]Instituto abandonado
sector.超限工艺-废弃研究所.description = ........ \n[yellow]¿Estás seguro de que el instituto está aquí? \n[green]No te preocupes, lo recuerdo bien. \n \n[white]Dificultad: difícil
sector.超限工艺-废弃研究所.details = [lightgrey]inicio DE LA función
sector.超限工艺-边陲哨站.name = [red]Puesto fronterizo
sector.超限工艺-边陲哨站.description = Ahora tenemos que tener cuidado. __ New __[yellow]base enemiga? ¡Jaja! \n[green]Esta va a ser una batalla cuesta arriba. \n \n[white]Dificultad: difícil
sector.超限工艺-菌疫峡谷.name = [red]Bacterias[blue]Pandemia[red]Garganta[blue]Valle
sector.超限工艺-菌疫峡谷.description = Al menos por ahora, parece que habrá una pelea a tres bandas. \n \n[white]Dificultad: Difícil
