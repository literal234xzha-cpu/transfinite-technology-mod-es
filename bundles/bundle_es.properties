block.超限工艺-BAAs超限科技s.name=[blue] Grupo por encima del límite (TT)
block.超限工艺-BAAs超限科技s.description=Un grupo científico liderado por Yupu Xilong y Ip Xilong ejerce un gobierno dictatorial, está entusiasmado con ciertas tecnologías de vanguardia y presta mucha atención a las tecnologías electromagnéticas; quizás ya se han desviado del principio inicial centrado en la ciencia.
block.超限工艺-BAAs超限科技s.details=[blue] La búsqueda de la verdad.


