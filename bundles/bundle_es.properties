block.超限工艺-BA1s超位算体.name=[orange] Calculador de bits completos (OEO)
block.超限工艺-BA1s超位算体.description=La alianza liderada por el cerebro principal [orange] Omega [white] está compuesta por fuerzas grandes y pequeñas, combinando las fortalezas y debilidades de varias fuerzas, la súper alianza, la primera guerra de Chipre Perdedor
block.超限工艺-BA1s超位算体.details=[orange] Después de todo, es solo un sueño roto

block.超限工艺-BA1sGT1A精细化石墨调控厂.name=OEO-Compresor de grafito refinado
block.超限工艺-BA1sGT1A精细化石墨调控厂.description=Una instalación industrial de base informática completa, diseñada por [green] Kappa [white].\nA través de la regulación y el cálculo precisos, el carbón comprimido refinado se convierte en grafito, que puede hacer un alto uso de los recursos, gran rendimiento, largo tiempo de procesamiento y requiere consumo de energía.\n &lt;&lt;T2 &gt;&gt;&lt;&lt; T3&gt;&gt;

block.超限工艺-BA1sGT1B精细化硅调控厂.name=OEO-refinería de silicio refinado
block.超限工艺-BA1sGT1B精细化硅调控厂.description=Instalaciones industriales básicas de tipo integral, diseñadas por [green] Kappa [white].\nA través de la regulación y el cálculo precisos, refinar el silicio, puede hacer un alto uso de los recursos, gran producción, largo tiempo de procesamiento, requiere consumo de energía. [orange][全位算体精加工厂]

block.超限工艺-BA1sGT1C精细化玻璃调控厂.name=OEO-horno de vidrio refinado
block.超限工艺-BA1sGT1C精细化玻璃调控厂.description=Instalaciones industriales básicas de tipo integral, diseñadas por [green] Kappa [white].\nA través de la regulación y el cálculo precisos, la producción refinada de vidrio templado, puede hacer un alto uso de los recursos, gran producción, largo tiempo de procesamiento, necesidad de consumo de energía. [orange][全位算体精加工厂]

block.超限工艺-BA1sGT1D精细化硫调控厂.name=OEO-Planta de control de azufre refinado
block.超限工艺-BA1sGT1D精细化硫调控厂.description=Instalaciones industriales básicas de tipo integral, diseñadas por [green] Kappa [white].\nA través de un control y cálculo precisos, el despliegue refinado de sulfuros puede hacer un alto uso de los recursos, gran rendimiento, largo tiempo de procesamiento y consumo de energía. [orange][全位算体精加工厂]

block.超限工艺-BA1sGT1E精细炸药厂.name=OEO-Planta de mezcla de explosivos finos
block.超限工艺-BA1sGT1E精细炸药厂.description=Instalaciones industriales básicas de tipo integral, diseñadas por [green] Kappa [white].\nA través de la regulación y el cálculo precisos, el acabado produce mezclas explosivas, que pueden hacer un alto uso de los recursos, gran rendimiento, largo tiempo de procesamiento y consumo de energía. [orange][全位算体精加工厂]

block.超限工艺-BA1sGT1F精细塑钢厂.name=OEO-Planta de prensado de acero de plástico fino
block.超限工艺-BA1sGT1F精细塑钢厂.description=Instalaciones industriales básicas de tipo integral, diseñadas por [green] Kappa [white].\nA través de un control y cálculo precisos, prensado de acero plástico de alta eficiencia, puede hacer un alto uso de los recursos, gran rendimiento, largo tiempo de procesamiento y consumo de energía. [orange][全位算体精加工厂]

