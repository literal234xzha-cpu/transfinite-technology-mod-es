sector.超限工艺-零号地区.name=Área cero
sector.超限工艺-零号地区.description=[yellow] ¡Advertencia! ¡El núcleo está a punto de aterrizar!\n\n[white] Dificultad: Mengxin
sector.超限工艺-零号地区.details=[lightgrey] Donde comienzan los sueños

sector.超限工艺-冰冻森林.name=Bosque congelado
sector.超限工艺-冰冻森林.description=El área de recolección de plantas de esporas, donde hay una rica reserva de carbón. Podemos volver a desarrollar nuestra industria.\n\n[white] Dificultad: Simple
sector.超限工艺-冰冻森林.details=[lightgrey] Recuperación industrial

sector.超限工艺-未知废墟.name=Ruinas desconocidas
sector.超限工艺-未知废墟.description=La fuente de la señal de la destrucción del núcleo anterior es también el lugar que vamos a investigar.\n\n[white]Dificultad: Fácil
sector.超限工艺-未知废墟.details=[lightgrey] Desde entonces, abra la tecnología modular

sector.超限工艺-孢染丛林.name=Bosque tiñido
sector.超限工艺-孢染丛林.description=Las selvas más profundas y remotas del bosque helado también son la fuente de señales de ubicación anteriores.\n\n[white] Dificultad: Moderada
sector.超限工艺-孢染丛林.details=[lightgrey] ¿He viajado al drama antijaponés?

sector.超限工艺-陨石带.name=[blue] Cinturón de meteoritos
sector.超限工艺-陨石带.description=Por ahora, el estado del cinturón de meteoritos no es muy bueno, donde parece que se detectan señales centrales.\n [yellow] Aún no he llegado, espera.\n\n[white] Dificultad: Moderada
sector.超限工艺-陨石带.details=[lightgrey] Kamikaze Killing Squad

sector.超限工艺-污染小道.name=[blue] Trayallos de contaminación
sector.超限工艺-污染小道.description=Aquí hay un puesto de avanzada de fuerzas desconocidas. Es posible que podamos descubrir su verdadera identidad, pero tenga cuidado. Esto no es simple. Hemos establecido un puesto de avanzada aquí. Puedes venir y ayudarnos a atacar en cualquier momento.\n\n[white]Dificultad: Fácil
sector.超限工艺-污染小道.details=[lightgrey] En teoría, tienes buenas habilidades, puedes vivir con refuerzos

sector.超限工艺-生物质合成区.name=[darkgrey] Zona de síntesis de biomasa (rama)
sector.超限工艺-生物质合成区.description=&lt;&lt;T0 &gt;&gt;\n\n[white] Dificultad:[slate]ERROR

sector.超限工艺-真菌通道.name=Canal de hongos
sector.超限工艺-真菌通道.description=Solía ser una base para [red] el Parlamento de Zeta [white], pero ahora está destruido.\n\n[white] Dificultad: Moderada

sector.超限工艺-工业区0032.name=[orange] Zona industrial 0032
sector.超限工艺-工业区0032.description=Hemos confirmado que hay una señal central aquí, que es nuestra zona industrial. Espero que la señal provenga de los restos de [yellow] aritmética completa [white].\n\n[white] Dificultad: Simple

sector.超限工艺-盐碱荒滩.name=[red] Playa desierta de sal y álcali
sector.超限工艺-盐碱荒滩.description=Quizás también deberíamos avanzar un poco más abajo, pero debemos tener cuidado, es probable que la señal central aquí provenga del enemigo.\n\n[white]Dificultad: Moderada
sector.超限工艺-盐碱荒滩.details=[lightgrey] Daowei Tiangang

sector.超限工艺-遗迹海滩.name=[red] Playa de las ruinas
sector.超限工艺-遗迹海滩.description=Este será el final de nuestra etapa actual. Después de tomar esta zona costera, podremos reorganizar nuestras tropas.\n\n[white]Dificultad: Moderada
sector.超限工艺-遗迹海滩.details=[lightgrey] La leyenda de la electricidad y el agua

sector.超限工艺-废弃研究所.name=[orange] Instituto abandonado
sector.超限工艺-废弃研究所.description=........\n [yellow] ¿Estás seguro de que el instituto está aquí?\n [green] No te preocupes, no recuerdo mal.\n\n[white] Dificultad: Dificultad
sector.超限工艺-废弃研究所.details=[lightgrey] Comienza el largometraje

sector.超限工艺-边陲哨站.name=[red] Estación de avanzada fronteriza
