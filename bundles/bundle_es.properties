block.超限工艺-ZY世界处理雷达.description=Enemigo de gran alcance, utilizado para la edición de mapas

#单位
#泽塔Zeta Imperium (unit)
unit.超限工艺-uA0CCZAT1钝击.name=ZI-golpe contundente (pasado de moda)
unit.超限工艺-uA0CCZAT1钝击.description=[red] La unidad de producción en masa del Parlamento de Zeta [white], diseñada por [#dc143cff] Beta [white], sirvió como vanguardia en la carga al comienzo de la Primera Guerra de Chipre.\n Armadura frágil, artillería con una sola mano, atrasada y anticuada, ha sido reemplazada por una mejor versión mejorada.\n &lt;&lt;T4 &gt;&gt;&lt;&lt; T5&gt;&gt;

unit.超限工艺-uA0CCZAT2锤打.name=ZI-martillado (pasado de moda)
unit.超限工艺-uA0CCZAT2锤打.description=[red] La unidad de producción en masa del Parlamento de Zeta [white], diseñada por [#dc143cff] Beta [white], sirvió como unidad base para el ataque en los primeros días de la Primera Guerra de Chipre.\n La armadura es relativamente frágil, la artillería de doble cañón con una sola mano, atrasada y anticuada, ha sido reemplazada por una mejor versión mejorada.\n[red][泽塔议会老式部队]

unit.超限工艺-uA0CCZBT0清风.name=ZI-Breeze (pasado de moda)
unit.超限工艺-uA0CCZBT0清风.description=[red] La unidad de producción en masa del Parlamento de Zeta [white], diseñada por [unlaunched] Kesi &lt;T3&gt;&gt;, se utilizó para atacar a las tropas o bases de la aritmética completa en la primera guerra de Cypress.\n La armadura es relativamente frágil, los ataques suicidas, atrasados y anticuados, y después de la mejora, ahora se ha convertido en una fuerza suicida del grupo que supera el límite.\n[red][泽塔议会老式部队]

unit.超限工艺-uA0CCZBT1微风.name=ZI-Breeze (vintage)
unit.超限工艺-uA0CCZBT1微风.description=[red]Unidad de producción en serie del [white]Consejo Zeta, diseñada por [#dc143cff]Beta[white], que sirvió como fuerza de vanguardia durante los primeros días de la Primera Guerra de Cipro.\n La armadura es relativamente frágil, la artillería de un solo cañón, incapaz de vaciar y girar, atrasada y anticuada, ha sido reemplazada por una mejor versión mejorada.\n[red][泽塔议会老式部队]

unit.超限工艺-uA0CCZBT2旋刃.name=ZI-Spin Blade (anticuado)
unit.超限工艺-uA0CCZBT2旋刃.description=La unidad de producción en serie del [red]Consejo Zeta[white], diseñada por [#dc143cff]Beta[white], sirvió como fuerza de ataque básica durante los primeros estadios de la Primera Guerra de Cypro.\n La armadura es relativamente frágil, la artillería de disparo continuo de un solo cañón, atrasada y anticuada, ha sido reemplazada por una mejor versión mejorada.\n[red][泽塔议会老式部队]

#单位
#超限Transfinite Technocracy (unit)

unit.超限工艺-uAABT0D看护.name=TT-Enfermería
unit.超限工艺-uAABT0D看护.description=[blue] La fuerza de seguridad básica del grupo de exceso de límite [white], diseñada por [sky] Oeste &lt;T3&gt;&gt;, tiene una efectividad de combate débil y se usa a menudo para patrullas e investigaciones de bases.\n Unidad de suspensión simple, capaz de moverse a alta velocidad, con alta velocidad de ataque, poderosa ametralladora anti-construcción, no puede atacar unidades aéreas.\n\n[blue][超限技术特殊作战单元]

unit.超限工艺-uAABT0K候鸟.name=TT-Aves migratorias
unit.超限工艺-uAABT0K候鸟.description=Las fuerzas de seguridad básicas del Grupo [blue] [white], diseñadas por [sky] Oeste [white], tienen un poder de combate reducido y se utilizan habitualmente para patrullar y realizar reconocimiento en las bases.\n unidad de vuelo, pequeña y rápida, con una velocidad de ataque extremadamente alta, poderosa ametralladora anti-construcción, no puede atacar la unidad aérea.\n\n[blue][超限技术特殊作战单元]

unit.超限工艺-uAABT1A响应.name=TT-Fengying
unit.超限工艺-uAABT1A响应.description=[blue] La fuerza de vanguardia del grupo de exceso de límite [white] está diseñada por [unlaunched] Kexi [white]. Reúne principalmente tareas de limpieza en el campo de batalla. Se recomienda cooperar con el búnker durante la defensa.\n Mech ligero especial, rápido de movimiento, barato, pero el arma es baja y la armadura es baja.\n\n[blue][超限技术作战轻机甲]
unit.超限工艺-uAABT1A响应.details=Escalada azul

unit.超限工艺-uAABT1B卫兵.name=TT-Falcon
unit.超限工艺-uAABT1B卫兵.description=[blue] La fuerza de vanguardia del grupo de exceso de límite [white] está diseñada por [unlaunched] Kexi [white]. Reúne principalmente misiones de ataque de fuego en el campo de batalla. Se recomienda cooperar con el búnker durante la defensa.\n Mech ligero especial, velocidad de movimiento rápido, mayor daño al edificio, mientras que atacar la unidad aérea tendrá un rango adicional de daño, barato, pero la velocidad de ataque es lenta y la armadura es baja.\n\n[blue][超限技术作战轻机甲]
unit.超限工艺-uAABT1B卫兵.details=Soldado de tubo, pero no Superman de tubo

unit.超限工艺-uAABT2I天星.name=TT-estrellas
unit.超限工艺-uAABT2I天星.description=[blue] La fuerza de bombardeo del grupo de exceso de límite [white] está diseñada por [unlaunched] Kexi [white], y realiza principalmente misiones de bombardeo diarias en el campo de batalla.\nSe utiliza para asaltar edificios enemigos, rociar bombas de alta energía en unidades terrestres, unidades voladoras, de alta velocidad, capaces de transportar una pequeña cantidad de unidades o edificios, y la muerte genera flander-A.\n\n[blue][超限技术特殊作战单元]

#单位
#算体Omni-Equilibrium Order (unit)

unit.超限工艺-u1A1ha11利刃.name=OEO-Hoja afilada
unit.超限工艺-u1A1ha11利刃.description=[orange] Total de aritmética [white] Ejército base, diseñado por [pink] Delta [white] &lt;T4&gt;&gt; Consejo Zeta [white] El prototipo de cuchillo afilado Mecha, la vanguardia de la Legión de aritmética completa.\nVelocidad de movimiento más rápida, armadura ligera, tres balas estándar disparadas al enemigo a la vez durante el ataque.\n\n[orange][全位算体常规部队]

unit.超限工艺-u1A1ha1狂战士.name=OEO-Furia de llama
unit.超限工艺-u1A1ha1狂战士.description=[orange] aritmética completa [white] Ejército principal, diseñado por [pink] Delta [white] &lt;T4&gt;&gt; Consejo Zeta [white] Warhammer and Fortress El prototipo de mech, un enemigo extremadamente terrible en el campo de batalla, avanzó con la guerra.\n La armadura es pesada, dispara obuses de fuego contra enemigos cercanos, con cuatro ametralladoras para ayudar en el ataque, cuerpo a cuerpo puede ser incendiado.\n[orange][全位算体精英部队]

unit.超限工艺-u1A1hb11落星.name=OEO-estrellas que caen
unit.超限工艺-u1A1hb11落星.description=[orange] aritmética completa [white] Fuerza aérea básica, diseñada por [pink] Delta [white] &lt;T4&gt;&gt; Consejo Zeta [white] El prototipo de Xinghui Combatiente, unidad de vanguardia en el cuerpo de cálculo completo.\n Aviones de combate convencionales que disparan dos balas estándar y un misil a los enemigos en el suelo a la vez.\n\n[orange][全位算体常规部队]

unit.超限工艺-u1A1hb12空点.name=OEO-punto vacío
unit.超限工艺-u1A1hb12空点.description=[orange] aritmética completa [white] Fuerza aérea básica, diseñada por [pink] Delta &lt;T3&gt;&gt; &lt;T4&gt;&gt; Concilio Zeta [white] Bombardero prototipo de Tianyin, unidad táctica en el cuerpo de aritmética completa.\n Bombardero estándar, con armadura moderada, equipado con dos ametralladoras para atacar al ejército, cuando se acercaba al ejército, se colocó una gran cantidad de bombas anti-búnker.\n\n[orange][全位算体常规部队]

unit.超限工艺-u1A1hb1扫荡者.name=OEO-barrida
unit.超限工艺-u1A1hb1扫荡者.description=[orange] aritmética completa [white] Fuerza Aérea de batalla principal, diseñada por [pink] Delta [white], &lt;T4&gt;&gt; Consejo Zeta [white] El prototipo del cielo El avión de ataque, la fuerza principal en el cuerpo completo.\nEl avión de ataque estándar lanza una gran cantidad de misiles contra enemigos terrestres cercanos. Cada misil contiene una gran cantidad de solución de escoria, lo que causa un golpe devastador en el edificio. Su arma principal láser todavía tiene una amenaza extremadamente terrible.\n[orange][全位算体精英部队]

unit.超限工艺-u1A1hb4贯日.name=OEO-Guanri
unit.超限工艺-u1A1hb4贯日.description=[orange] aritmética completa [white] Fuerza Aérea de nivel experimental, diseñada por [slate] Ou Zewen [white], debería haber sido enterrada con la historia cuando nació de manera inoportuna, y ahora está en el equipo de investigación científica. Reapareció bajo los esfuerzos. Armadura pesada, unidad de asedio poderosa, con modo desplegado y modo no desplegado.\nEn el modo de no despliegue, el arma secundaria es el principal medio de ataque, y el arma secundaria es lanzada para contrarrestar efectivamente el misil de la unidad.\nDespués del despliegue, el cañón principal se puede encender. El cañón principal puede disparar un cañón de fusión en caliente devastador al edificio. [red] no se puede mover durante el despliegue [white]. Tras realizar la transformación de forma, no podrás atacar durante 10 segundos.\n[orange][全位算体实验级部队]

unit.超限工艺-u1A1hb4贯日(1).name=OEO-Guanri [部署]
unit.超限工艺-u1A1hb4贯日(1).description=[orange]Arma de cálculo integral [white]de nivel experimental para la fuerza aérea, diseñada por [slate]Ou Zewen [white]; víctima de su época, debió haber quedado sepultada en el olvido, pero hoy, gracias al esfuerzo del equipo de investigación, ha vuelto a ver la luz. Armadura pesada, unidad de asedio poderosa, con modo desplegado y modo no desplegado. En el modo sin despliegue, las baterías secundarias constituyen el principal medio de ataque; al disparar, lanzan misiles que neutralizan eficazmente a las unidades enemigas. Tras la colocación, se puede activar el cañón principal, que puede disparar proyectiles de fusión térmica devastadores contra los edificios. Durante la colocación, [red] no puede moverse; [white]. Tras realizar la transformación de forma, no podrás atacar durante 10 segundos.\n[orange][全位算体实验级部队]

unit.超限工艺-u1A1hc1猎杀者.name=OEO-Caza
unit.超限工艺-u1A1hc1猎杀者.description=[orange] aritmética completa [white] Armada principal, diseñada por [pink] Delta [white] &lt;T4&gt;&gt; Consejo Zeta [white] Ballena alabarda y tiburón volador El prototipo de acorazado, la fuerza principal de la Armada de aritmética completa.\n Armadura pesada, equipada con cañones de riel de alta precisión, y equipada con dos cañones de panal y cuatro cañones para ataques auxiliares.\n[orange][全位算体精英部队]

unit.超限工艺-u1A1hc11青鲛.name=OEO-tiburón verde
unit.超限工艺-u1A1hc11青鲛.description=[orange] Full-bit aritmética [white] Armada básica, diseñada por [pink] Delta [white] &lt;T4&gt;&gt; Concilio de Zeta [white] Prototipo de Mecha de Barracuda. Lancha de asalto armada con un cañón principal y dos ametralladoras de alta cadencia.\n[orange][全位算体常规部队]

